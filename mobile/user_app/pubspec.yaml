name: daleel_user_app
description: "Daleel Ay Khidma - Official Flutter User Application for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Shared Core
  daleel_core:
    path: ../shared_core

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^13.2.0

  # Networking & Caching
  dio: ^5.4.0
  cached_network_image: ^3.3.1

  # Device & Features
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
